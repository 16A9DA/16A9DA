  <text x="567" y="142" text-anchor="middle" class="mono" font-size="16" fill="#1A1A1A">?</text>

  <!-- RESET Warp Pipe -->
  <text x="652" y="168" text-anchor="middle" class="mono" font-size="9" fill="#1A1A1A">RESET</text>
  <rect x="630" y="176" width="44" height="12" fill="#F5D87A" stroke="#1A1A1A" stroke-width="2.5" />
  <rect x="635" y="188" width="34" height="30" fill="#F5D87A" stroke="#1A1A1A" stroke-width="2.5" />

  <!-- Flagpole -->
  <text x="720" y="110" text-anchor="middle" class="mono" font-size="9" fill="#1A1A1A">CO-OP</text>
  <line x1="740" y1="122" x2="740" y2="218" stroke="#1A1A1A" stroke-width="3" />
  <circle cx="740" cy="120" r="5" fill="#F5D87A" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="740,125 708,138 740,151" fill="#E8857A" stroke="#1A1A1A" stroke-width="2" />

