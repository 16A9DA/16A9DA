<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 264" width="800" height="264" role="img" aria-label="16A9DA Retro Mario World 1-1">
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; font-weight: 800; }
      @keyframes jumpBob {
        0%, 100% { transform: translateY(0px); }
        45% { transform: translateY(-16px); }
        60% { transform: translateY(-16px); }
      }
      @keyframes blockBump {
        0%, 40%, 100% { transform: translateY(0px); }
        52% { transform: translateY(-6px); }
      }
      @keyframes coinPop {
        0%, 42% { opacity: 0; transform: translateY(10px); }
        55% { opacity: 1; transform: translateY(-8px); }
        85% { opacity: 1; transform: translateY(-14px); }
        100% { opacity: 0; transform: translateY(-18px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .mario { animation: jumpBob 2.4s ease-in-out infinite; }
      .bump { animation: blockBump 2.4s ease-in-out infinite; }
      .coin { animation: coinPop 2.4s ease-in-out infinite; }
      .blink { animation: blink 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="8" y="8" width="784" height="248" fill="#1A1A1A" />
  <rect x="4" y="4" width="784" height="248" fill="#6ECFCF" stroke="#1A1A1A" stroke-width="3" />

  <!-- Top HUD -->
  <rect x="4" y="4" width="784" height="34" fill="#F5D87A" stroke="#1A1A1A" stroke-width="3" />
  <text x="18" y="25" class="mono" font-size="11.5" fill="#1A1A1A"><tspan class="blink" fill="#E8857A">✳</tspan> RAYYAN AHMED // 16A9DA</text>
  <text x="410" y="25" text-anchor="middle" class="mono" font-size="11.5" fill="#1A1A1A">WORLD 1-1</text>
  <text x="774" y="25" text-anchor="end" class="mono" font-size="11" fill="#1A1A1A">BMW AGENTIC AI INTERN <tspan class="blink" fill="#E8857A">✳</tspan></text>

  <!-- Clouds -->
  <rect x="132" y="52" width="44" height="10" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <rect x="142" y="46" width="24" height="8" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <rect x="144" y="51" width="20" height="3" fill="#F2EDD7" />

  <rect x="556" y="54" width="48" height="10" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
