  <rect x="570" y="53" width="20" height="3" fill="#F2EDD7" />

  <!-- Ground -->
  <rect x="4" y="218" width="784" height="34" fill="#E8857A" stroke="#1A1A1A" stroke-width="3" />
  <line x1="4" y1="235" x2="788" y2="235" stroke="#1A1A1A" stroke-width="2" opacity="0.35" />
  <line x1="70" y1="218" x2="70" y2="252" stroke="#1A1A1A" stroke-width="2" opacity="0.35" />
