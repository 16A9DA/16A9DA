<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 362" width="840" height="362" role="img" aria-label="Rayyan Ahmed - Retro Mario Bento Card">
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; font-weight: 800; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .title { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; font-weight: 900; letter-spacing: 1px; }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes blinkStar {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .float { animation: floatY 2.2s ease-in-out infinite; }
      .float-slow { animation: floatY 2.8s ease-in-out infinite; }
      .blink { animation: blinkStar 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- TOP HUD BAR -->
  <rect x="10" y="10" width="820" height="38" fill="#1A1A1A" />
  <rect x="6" y="6" width="820" height="38" fill="#F5D87A" stroke="#1A1A1A" stroke-width="3" />
  <text x="22" y="30" class="mono" font-size="13" fill="#1A1A1A" letter-spacing="1.2">
    <tspan class="blink" fill="#E8857A">✳</tspan> RAYYAN AHMED // 16A9DA
  </text>
  <text x="420" y="30" text-anchor="middle" class="mono" font-size="12" fill="#1A1A1A" letter-spacing="1.5">WORLD 1-1</text>
  <text x="810" y="30" text-anchor="end" class="mono" font-size="12" fill="#1A1A1A" letter-spacing="1">
    LIVES x ∞ <tspan class="blink" fill="#E8857A">✳</tspan>
  </text>

  <!-- LEFT HERO CARD -->
  <rect x="10" y="60" width="474" height="232" fill="#1A1A1A" />
  <rect x="6" y="56" width="474" height="232" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="3" />

  <text x="26" y="86" class="mono" font-size="11" fill="#1A1A1A" letter-spacing="1.4">HELLO, I'M RAYYAN AHMED</text>

  <!-- Big Retro Headline -->
  <text x="26" y="124" class="title" font-size="28" fill="#1A1A1A">AGENTIC <tspan fill="#E8857A" stroke="#1A1A1A" stroke-width="1.5" paint-order="stroke">AI</tspan></text>
  <text x="26" y="158" class="title" font-size="25" fill="#6ECFCF" stroke="#1A1A1A" stroke-width="3" paint-order="stroke">&amp; MODEL TRAINING</text>

  <text x="26" y="188" class="sans" font-size="13.5" font-weight="600" fill="#1A1A1A">CS @ University of Debrecen · Hungary</text>
  <text x="26" y="208" class="sans" font-size="13" fill="#1A1A1A" opacity="0.85">Autonomous agents, local LLMs &amp; PyTorch training loops.</text>

  <!-- 3 Focus Pills -->
  <rect x="29" y="231" width="124" height="36" fill="#1A1A1A" />
  <rect x="26" y="228" width="124" height="36" fill="#6ECFCF" stroke="#1A1A1A" stroke-width="2.5" />
  <text x="88" y="250" text-anchor="middle" class="mono" font-size="11" fill="#1A1A1A">AGENTIC AI</text>

  <rect x="165" y="231" width="144" height="36" fill="#1A1A1A" />
  <rect x="162" y="228" width="144" height="36" fill="#F5D87A" stroke="#1A1A1A" stroke-width="2.5" />
  <text x="234" y="250" text-anchor="middle" class="mono" font-size="11" fill="#1A1A1A">MODEL TRAINING</text>

  <rect x="321" y="231" width="144" height="36" fill="#1A1A1A" />
  <rect x="318" y="228" width="144" height="36" fill="#E8857A" stroke="#1A1A1A" stroke-width="2.5" />
  <text x="390" y="250" text-anchor="middle" class="mono" font-size="11" fill="#1A1A1A">ALWAYS LEARNING</text>

  <!-- RIGHT TOP: MARIO PIXEL STAGE (CYAN SKY) -->
  <rect x="498" y="60" width="332" height="142" fill="#1A1A1A" />
  <rect x="494" y="56" width="332" height="142" fill="#6ECFCF" stroke="#1A1A1A" stroke-width="3" />

  <!-- Pixel Clouds -->
  <rect x="514" y="72" width="38" height="12" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <rect x="522" y="65" width="22" height="9" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <rect x="524" y="70" width="18" height="4" fill="#F2EDD7" />

  <rect x="752" y="76" width="44" height="12" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <rect x="762" y="69" width="24" height="9" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <rect x="764" y="74" width="20" height="4" fill="#F2EDD7" />

  <!-- Floating Coin -->
  <g class="float">
    <rect x="596" y="72" width="14" height="20" fill="#F5D87A" stroke="#1A1A1A" stroke-width="2.5" />
    <rect x="601" y="76" width="4" height="12" fill="#1A1A1A" />
  </g>

  <!-- Brick + Question Block + Brick -->
  <rect x="562" y="102" width="26" height="26" fill="#E8857A" stroke="#1A1A1A" stroke-width="2.5" />
  <line x1="562" y1="115" x2="588" y2="115" stroke="#1A1A1A" stroke-width="2" />
  <line x1="575" y1="102" x2="575" y2="115" stroke="#1A1A1A" stroke-width="2" />

  <g class="float-slow">
    <rect x="590" y="102" width="26" height="26" fill="#F5D87A" stroke="#1A1A1A" stroke-width="2.5" />
    <text x="603" y="121" text-anchor="middle" class="mono" font-size="16" fill="#1A1A1A">?</text>
  </g>

  <rect x="618" y="102" width="26" height="26" fill="#E8857A" stroke="#1A1A1A" stroke-width="2.5" />
  <line x1="618" y1="115" x2="644" y2="115" stroke="#1A1A1A" stroke-width="2" />
  <line x1="631" y1="102" x2="631" y2="115" stroke="#1A1A1A" stroke-width="2" />

  <!-- Pixel Mushroom on Ground -->
  <g transform="translate(524, 146)">
    <!-- Cap -->
    <rect x="4" y="0" width="22" height="6" fill="#E8857A" stroke="#1A1A1A" stroke-width="2" />
    <rect x="0" y="5" width="30" height="11" fill="#E8857A" stroke="#1A1A1A" stroke-width="2" />
    <!-- White spots -->
    <rect x="4" y="7" width="6" height="6" fill="#F2EDD7" />
    <rect x="19" y="7" width="6" height="6" fill="#F2EDD7" />
    <!-- Stem -->
