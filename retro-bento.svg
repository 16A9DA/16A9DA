    <rect x="10" y="18" width="2" height="5" fill="#1A1A1A" />
    <rect x="18" y="18" width="2" height="5" fill="#1A1A1A" />
  </g>

  <!-- Warp Pipe -->
  <rect x="676" y="138" width="42" height="12" fill="#F5D87A" stroke="#1A1A1A" stroke-width="2.5" />
  <rect x="681" y="150" width="32" height="22" fill="#F5D87A" stroke="#1A1A1A" stroke-width="2.5" />
  <rect x="686" y="152" width="6" height="18" fill="#F2EDD7" opacity="0.7" />

  <!-- Flagpole -->
  <line x1="784" y1="96" x2="784" y2="172" stroke="#1A1A1A" stroke-width="3" />
  <circle cx="784" cy="94" r="5" fill="#F5D87A" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="784,99 756,110 784,121" fill="#E8857A" stroke="#1A1A1A" stroke-width="2" />

  <!-- Ground Strip -->
  <rect x="494" y="172" width="332" height="26" fill="#E8857A" stroke="#1A1A1A" stroke-width="3" />
  <line x1="494" y1="185" x2="826" y2="185" stroke="#1A1A1A" stroke-width="2" />
  <line x1="528" y1="172" x2="528" y2="185" stroke="#1A1A1A" stroke-width="2" />
  <line x1="576" y1="172" x2="576" y2="185" stroke="#1A1A1A" stroke-width="2" />
  <line x1="624" y1="172" x2="624" y2="185" stroke="#1A1A1A" stroke-width="2" />
  <line x1="672" y1="172" x2="672" y2="185" stroke="#1A1A1A" stroke-width="2" />
  <line x1="720" y1="172" x2="720" y2="185" stroke="#1A1A1A" stroke-width="2" />
  <line x1="768" y1="172" x2="768" y2="185" stroke="#1A1A1A" stroke-width="2" />
  <line x1="552" y1="185" x2="552" y2="198" stroke="#1A1A1A" stroke-width="2" />
  <line x1="600" y1="185" x2="600" y2="198" stroke="#1A1A1A" stroke-width="2" />
  <line x1="648" y1="185" x2="648" y2="198" stroke="#1A1A1A" stroke-width="2" />
  <line x1="696" y1="185" x2="696" y2="198" stroke="#1A1A1A" stroke-width="2" />
  <line x1="744" y1="185" x2="744" y2="198" stroke="#1A1A1A" stroke-width="2" />
  <line x1="792" y1="185" x2="792" y2="198" stroke="#1A1A1A" stroke-width="2" />

  <!-- RIGHT BOTTOM: LOADOUT CARD -->
  <rect x="498" y="214" width="332" height="78" fill="#1A1A1A" />
  <rect x="494" y="210" width="332" height="78" fill="#F5D87A" stroke="#1A1A1A" stroke-width="3" />

  <text x="510" y="232" class="mono" font-size="11" fill="#1A1A1A" letter-spacing="1.4">LOADOUT // STACK</text>

  <!-- Stack Chips -->
  <rect x="510" y="244" width="58" height="26" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <text x="539" y="261" text-anchor="middle" class="mono" font-size="10.5" fill="#1A1A1A">Python</text>

  <rect x="574" y="244" width="64" height="26" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <text x="606" y="261" text-anchor="middle" class="mono" font-size="10.5" fill="#1A1A1A">PyTorch</text>

  <rect x="644" y="244" width="62" height="26" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <text x="675" y="261" text-anchor="middle" class="mono" font-size="10.5" fill="#1A1A1A">FastAPI</text>

  <rect x="712" y="244" width="56" height="26" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="2" />
  <text x="740" y="261" text-anchor="middle" class="mono" font-size="10.5" fill="#1A1A1A">Ollama</text>

  <rect x="774" y="244" width="38" height="26" fill="#6ECFCF" stroke="#1A1A1A" stroke-width="2" />
  <text x="793" y="261" text-anchor="middle" class="mono" font-size="10.5" fill="#1A1A1A">RAG</text>

  <!-- BOTTOM FOOTER BAR -->
  <rect x="10" y="308" width="820" height="44" fill="#1A1A1A" />
  <rect x="6" y="304" width="820" height="44" fill="#F2EDD7" stroke="#1A1A1A" stroke-width="3" />

  <text x="22" y="331" class="mono" font-size="11.5" fill="#1A1A1A">
    <tspan fill="#E8857A">✳</tspan> GOLD MEDAL @ KANZ AI HACKATHON · ALWAYS READY TO BUILD
  </text>

  <rect x="592" y="313" width="220" height="26" fill="#6ECFCF" stroke="#1A1A1A" stroke-width="2" />
  <text x="702" y="330" text-anchor="middle" class="mono" font-size="10.5" fill="#1A1A1A">▼ PINNED REPOS BELOW ▼</text>
</svg>
